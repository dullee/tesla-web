<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla</title>
  </head>
  <body>
    <header>
      <div class="header-container">
        <div class="header-div flex flex-direction-row">
          <img
            src="images/header/site-logo.svg"
            alt="tesla-logo"
            class="header-images"
          />
          <div class="flex center nav-div">
            <span class="nav-button">Vehicles</span>
            <span class="nav-button">Energy</span>
            <span class="nav-button">Charging</span>
            <span class="nav-button">Discover</span>
            <span class="nav-button">Shop</span>
          </div>
          <div class="flex left-nav-div">
            <div class="header-image-div">
              <img
                src="images/header/iconButton.svg"
                alt=""
                class="header-images"
              />
            </div>
            <div class="header-image-div">
              <img
                src="images/header/iconButton-1.svg"
                alt=""
                class="header-images"
              />
            </div>
            <div class="header-image-div">
              <img
                src="images/header/iconButton-2.svg"
                alt=""
                class="header-images"
              />
            </div>
          </div>
        </div>
        <div class="header-dropdown-div">
          <div class="dropdown-container flex-direction-row">
            <div class="dropdown-image-container">
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 9.svg"
                  alt=""
                  class="dropdown-car-img"
                />
                <div class="dropdown-img-text-div center">
                  <h3 class="dropdown-subhead">Model S</h3>
                  <div class="dropdown-img-text-div-div">
                    <p class="dropdown-text">Learn</p>
                    <p class="dropdown-text">Order</p>
                  </div>
                </div>
              </div>
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 10.svg"
                  alt=""
                  class="dropdown-car-img"
                />
              </div>
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 8.svg"
                  alt=""
                  class="dropdown-car-img"
                />
              </div>
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 7.svg"
                  alt=""
                  class="dropdown-car-img"
                />
              </div>
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 12.svg"
                  alt=""
                  class="dropdown-car-img"
                />
              </div>
              <div class="dropdown-image-container-child">
                <img
                  src="images/header/dropdown/image 11.svg"
                  alt=""
                  class="dropdown-car-img"
                />
              </div>
            </div>
            <img src="images/header/dropdown/divider.svg" alt="" />
            <div class="dropdown-subcategory-div">
              <p class="dropdown-subcategory-text">Inventory</p>
              <p class="dropdown-subcategory-text">Used Cars</p>
              <p class="dropdown-subcategory-text">Demo Drive</p>
              <p class="dropdown-subcategory-text">Trade-in</p>
              <p class="dropdown-subcategory-text">Compare</p>
              <p class="dropdown-subcategory-text">Help Me Charge</p>
              <p class="dropdown-subcategory-text">Fleet</p>
              <p class="dropdown-subcategory-text">Semi</p>
              <p class="dropdown-subcategory-text">Roadster</p>
            </div>
          </div>
        </div>
      </div>
    </header>
    <main class="main">
      <section class="section-1 flex-direction-column">
        <img src="images/section-1/Model-Y.svg" alt="" class="background-img" />
        <div class="section-header-div flex-direction-column center">
          <h1 class="section-header">Model Y</h1>
          <h2>From $31,890*</h2>
          <p>After Federal Tax Credit & Est. Gas Savings</p>
        </div>
      </section>
    </main>
  </body>
</html>
